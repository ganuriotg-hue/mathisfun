<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unblocked Games</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; }
    h1 { padding: 20px; color: #e94560; }
    .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .game-card { background: #16213e; border-radius: 10px; padding: 10px; width: 200px; }
    .game-card a { color: #e94560; text-decoration: none; font-weight: bold; }
    iframe { width: 100%; height: 150px; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🎮 Unblocked Games</h1>
  <div class="games">

    <div class="game-card">
      <iframe src="https://scratch.mit.edu/projects/embed/10128515/" allowfullscreen></iframe>
      <a href="https://scratch.mit.edu/projects/10128515/" target="_blank">Scratch Game</a>
    </div>

    <div class="game-card">
      <iframe src="https://scratch.mit.edu/projects/embed/510186917/" allowfullscreen></iframe>
      <a href="https://scratch.mit.edu/projects/510186917/" target="_blank">Flappy Bird</a>
    </div>

    <div class="game-card">
      <iframe src="https://scratch.mit.edu/projects/embed/614762051/" allowfullscreen></iframe>
      <a href="https://scratch.mit.edu/projects/614762051/" target="_blank">Snake</a>
    </div>

    <div class="game-card">
      <iframe src="https://scratch.mit.edu/projects/embed/107136890/" allowfullscreen></iframe>
      <a href="https://scratch.mit.edu/projects/107136890/" target="_blank">Pac-Man</a>
    </div>

  </div>
</body>
</html>
