<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unblocked Games</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; }
    h1 { padding: 20px; color: #e94560; }
    .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .game-card { background: #16213e; border-radius: 10px; padding: 10px; width: 220px; }
    .game-card p { color: white; font-size: 16px; font-weight: bold; }
    .play-btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 999; }
    #game-container iframe { width: 100%; height: 100%; border: none; }
    #close-btn { position: fixed; top: 10px; right: 20px; z-index: 1000; background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🎮 Unblocked Games</h1>
  <div class="games">

    <div class="game-card">
      <p>❄️ Snow Rider 3D</p>
      <button class="play-btn" onclick="openGame('https://snow-rider-3d.github.io/')">▶ Play Now</button>
    </div>

  </div>

  <div id="game-container">
    <button id="close-btn" onclick="closeGame()">✖ Close Game</button>
    <iframe id="game-frame" src=""></iframe>
  </div>

  <script>
    function openGame(url) {
      document.getElementById('game-frame').src = url;
      document.getElementById('game-container').style.display = 'block';
    }
    function closeGame() {
      document.getElementById('game-frame').src = '';
      document.getElementById('game-container').style.display = 'none';
    }
  </script>

</body>
</html>
