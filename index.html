<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unblocked Games</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; }
    h1 { padding: 20px; color: #e94560; }
    .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .game-card { background: #16213e; border-radius: 10px; padding: 20px; width: 200px; }
    .game-card p { color: white; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .play-btn { background: #e94560; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; display: block; width: 100%; margin-bottom: 8px; }
    .play-btn:hover { background: #c73652; }
    #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 999; }
    #game-container iframe { width: 100%; height: 100%; border: none; }
    #btn-bar { position: fixed; top: 10px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
    #close-btn, #fs-btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🎮 Unblocked Games</h1>
  <div class="games">

    <div class="game-card">
      <p>🎿 Slope</p>
      <button class="play-btn" onclick="openGame('https://slope-game-io.github.io/')">▶ Play Now</button>
    </div>

    <div class="game-card">
      <p>🏀 Basketball Bros</p>
      <button class="play-btn" onclick="openGame('https://basketbros-game.github.io/')">▶ Play Now</button>
    </div>

    <div class="game-card">
      <p>🟡 Geometry Dash</p>
      <button class="play-btn" onclick="openGame('https://geometrydash-lite2.github.io/')">▶ Play Now</button>
    </div>

  </div>

  <div id="game-container">
    <div id="btn-bar">
      <button id="fs-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
      <button id="close-btn" onclick="closeGame()">✖ Close</button>
    </div>
    <iframe id="game-frame" src="" allowfullscreen></iframe>
  </div>

  <script>
    function openGame(url) {
      document.getElementById('game-frame').src = url;
      document.getElementById('game-container').style.display = 'block';
    }
    function closeGame() {
      document.getElementById('game-frame').src = '';
      document.getElementById('game-container').style.display = 'none';
    }
    function goFullscreen() {
      var iframe = document.getElementById('game-frame');
      if (iframe.requestFullscreen) iframe.requestFullscreen();
      else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
      else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
    }
  </script>

</body>
</html>
