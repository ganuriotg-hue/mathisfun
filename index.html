<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unblocked Games</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; }
    h1 { padding: 20px; color: #e94560; }
    .games { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .game-card { background: #16213e; border-radius: 10px; padding: 20px; width: 200px; }
    .game-card p { color: white; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .play-btn { background: #e94560; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; }
    .play-btn:hover { background: #c73652; }
  </style>
</head>
<body>
  <h1>🎮 Unblocked Games</h1>
  <div class="games">

    <div class="game-card">
      <p>❄️ Snow Rider 3D</p>
      <a href= <a href="https://snowrider3d.com" target="_blank">
        <button class="play-btn">▶ Play Now</button>
      </a>
    </div>

  </div>
</body>
</html>
