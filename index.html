```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Browser Games</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
}

h1{
    color:#ff4d6d;
    padding:20px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#16213e;
    border-radius:15px;
    padding:20px;
}

button{
    background:#ff4d6d;
    border:none;
    color:white;
    padding:12px;
    width:100%;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

#gameContainer{
    display:none;
    position:fixed;
    inset:0;
    background:black;
    z-index:999;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.topbar{
    position:absolute;
    top:15px;
    right:15px;
    display:flex;
    gap:10px;
}

.closeBtn{
    width:auto;
    padding:10px 20px;
}
</style>
</head>
<body>

<h1>🎮 Browser Games</h1>

<div class="games">

<div class="card">
<h2>🔫 1v1.LOL</h2>
<button onclick="openGame('https://1v1.lol/')">
Play
</button>
</div>

<div class="card">
<h2>🎤 Friday Night Funkin</h2>
<button onclick="openGame('https://ninja-muffin24.itch.io/funkin')">
Play
</button>
</div>

<div class="card">
<h2>🏀 Basketball Bros</h2>
<button onclick="openGame('https://basketbrosonline.com/')">
Play
</button>
</div>

<div class="card">
<h2>🐻 FNAF (browser version)</h2>
<button onclick="openGame('https://scratch.mit.edu/projects/469071750/embed')">
Play
</button>
</div>

</div>

<div id="gameContainer">
    <div class="topbar">
        <button class="closeBtn" onclick="closeGame()">
        ✖ Close
        </button>
    </div>

    <iframe id="gameFrame"></iframe>
</div>

<script>
function openGame(url){
    document.getElementById("gameFrame").src=url;
    document.getElementById("gameContainer").style.display="block";
}

function closeGame(){
    document.getElementById("gameFrame").src="";
    document.getElementById("gameContainer").style.display="none";
}
</script>

</body>
</html>
```
